<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container-formulario {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        .container-formulario h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .grupo-campo {
            margin-bottom: 18px;
        }

        .grupo-campo label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .grupo-campo input,
        .grupo-campo select,
        .grupo-campo textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .grupo-campo input:focus,
        .grupo-campo select:focus,
        .grupo-campo textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .grupo-campo textarea {
            resize: vertical;
            min-height: 90px;
        }

        .grupo-radio,
        .grupo-checkbox {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .grupo-radio label,
        .grupo-checkbox label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            cursor: pointer;
            margin-bottom: 0;
        }

        .grupo-radio input,
        .grupo-checkbox input {
            width: auto;
            accent-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .obrigatorio {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="container-formulario">
        <h2>Formulário de Cadastro</h2>

        <form action="#" method="post">
            <!-- Nome -->
            <div class="grupo-campo">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <!-- E-mail -->
            <div class="grupo-campo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <!-- Senha -->
            <div class="grupo-campo">
                <label for="senha">Senha <span class="obrigatorio">*</span></label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
            </div>

            <!-- Telefone -->
            <div class="grupo-campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <!-- Data de Nascimento -->
            <div class="grupo-campo">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento" name="nascimento">
            </div>

            <!-- Gênero -->
            <div class="grupo-campo">
                <label>Gênero</label>
                <div class="grupo-radio">
                    <label><input type="radio" name="genero" value="masculino"> Masculino</label>
                    <label><input type="radio" name="genero" value="feminino"> Feminino</label>
                    <label><input type="radio" name="genero" value="outro"> Outro</label>
                </div>
            </div>

            <!-- Estado -->
            <div class="grupo-campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Selecione...</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="BA">Bahia</option>
                </select>
            </div>

            <!-- Mensagem -->
            <div class="grupo-campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <!-- Termos -->
            <div class="grupo-campo">
                <div class="grupo-checkbox">
                    <label><input type="checkbox" name="termos" required> Aceito os termos de uso</label>
                </div>
            </div>

            <!-- Botão -->
            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
